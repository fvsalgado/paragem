# O calendário das Terras do Ameno — inventado, e completo.
#
# As regiões de prova deixam os feriados municipais por preencher de
# propósito, para provar que a lacuna aparece no relatório. Esta é a região no
# dia 100: está tudo preenchido, e o relatório dela não tem lacunas de
# calendário para mostrar.
#
# UM ANO LETIVO POR REGRA, E NÃO POR DATAS, como nas provas: uma região real
# transcreve o despacho de cada ano (`periodos`); uma inventada não tem
# despacho, e repete o mesmo ano letivo para sempre — o que a deixa construir-se
# em qualquer dia sem ficar sem horários a 1 de janeiro.
ano_letivo:
  regra_anual:
    - { tipo: aulas, inicio: { mes: 9, dia: 15 }, fim: { mes: 12, dia: 16 }, nota: 1.º período, arranque: true }
    - { tipo: ferias, inicio: { mes: 12, dia: 17 }, fim: { mes: 1, dia: 4 }, nota: férias de Natal }
    - { tipo: aulas, inicio: { mes: 1, dia: 5 }, fim: { mes: 3, dia: 20 }, nota: 2.º período }
    - { tipo: ferias, inicio: { mes: 3, dia: 21 }, fim: { mes: 4, dia: 6 }, nota: férias da Páscoa }
    - { tipo: aulas, inicio: { mes: 4, dia: 7 }, fim: { mes: 6, dia: 19 }, nota: 3.º período }
    - { tipo: ferias, inicio: { mes: 6, dia: 20 }, fim: { mes: 9, dia: 14 }, nota: férias de verão }
  confirmado: true
  fonte: inventado (região de demonstração)

feriados_nacionais:
  fixos:
    - { mes: 1, dia: 1, nome: Ano Novo }
    - { mes: 4, dia: 25, nome: Dia da Liberdade }
    - { mes: 5, dia: 1, nome: Dia do Trabalhador }
    - { mes: 6, dia: 10, nome: Dia de Portugal }
    - { mes: 8, dia: 15, nome: Assunção de Nossa Senhora }
    - { mes: 10, dia: 5, nome: Implantação da República }
    - { mes: 11, dia: 1, nome: Todos os Santos }
    - { mes: 12, dia: 1, nome: Restauração da Independência }
    - { mes: 12, dia: 8, nome: Imaculada Conceição }
    - { mes: 12, dia: 25, nome: Natal }
  moveis:
    - { deslocamento: -2, nome: Sexta-feira Santa }
    - { deslocamento: 0, nome: Domingo de Páscoa }
    - { deslocamento: 60, nome: Corpo de Deus }
  feriados_operadora: []

# Um por concelho, e um deles MÓVEL — anda com a Páscoa, como os há de
# verdade. Inventados todos; por isso confirmados: a fonte é este ficheiro.
feriados_municipais:
  - { concelho: porto-ameno, data: { mes: 6, dia: 29 }, confirmado: true, fonte: inventado }
  - { concelho: almeao, data: { mes: 7, dia: 22 }, confirmado: true, fonte: inventado }
  - { concelho: saramela, deslocamento_pascoa: 39, confirmado: true, fonte: inventado }
  - { concelho: corvalinho, data: { mes: 9, dia: 8 }, confirmado: true, fonte: inventado }
  - { concelho: montelirio, data: { mes: 5, dia: 15 }, confirmado: true, fonte: inventado }

codigos:
  periodo:
    A: { nome: Anual, regra: todo-o-ano }
    E: { nome: Escolar, regra: periodos-de-aulas }
    FE: { nome: Férias escolares, regra: periodos-de-ferias }
  dias:
    U: { nome: Dias úteis, dias_da_semana: [1, 2, 3, 4, 5], exclui_feriados: true }
    S: { nome: Sábados, dias_da_semana: [6], exclui_feriados: true }
    DF: { nome: Domingos e feriados, dias_da_semana: [7], inclui_feriados: true }
    # O comboio e o expresso não seguem os dias da rede: ao fim de semana o
    # comboio tem um horário só, e o expresso anda todos os dias.
    FS: { nome: Fins de semana e feriados, dias_da_semana: [6, 7], inclui_feriados: true }
    TD: { nome: Todos os dias, dias_da_semana: [1, 2, 3, 4, 5, 6, 7] }
  digitos:
    regra: dias-da-semana-por-digito
    mapa: { "2": 1, "3": 2, "4": 3, "5": 4, "6": 5 }
    exclui_feriados: true
