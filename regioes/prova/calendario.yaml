# Calendário da região de prova.
#
# Os períodos escolares estão preenchidos — são inventados, como tudo o resto.
# Os feriados municipais NÃO estão, e isso é de propósito: é a prova de que uma
# lacuna aparece no relatório em vez de desaparecer. Se um dia alguém "arrumar"
# o pipeline e as lacunas deixarem de ser contadas, é aqui que o CI dá por isso.

ano_letivo:
  identificador: 2025/2026
  periodos:
    - { tipo: aulas, inicio: 2025-09-15, fim: 2025-12-16, nota: 1.º período }
    - { tipo: ferias, inicio: 2025-12-17, fim: 2026-01-04, nota: férias de Natal }
    - { tipo: aulas, inicio: 2026-01-05, fim: 2026-03-20, nota: 2.º período }
    - { tipo: ferias, inicio: 2026-03-21, fim: 2026-04-06, nota: férias da Páscoa }
    - { tipo: aulas, inicio: 2026-04-07, fim: 2026-06-19, nota: 3.º período }
    - { tipo: ferias, inicio: 2026-06-20, fim: 2026-09-13, nota: férias de verão }
  confirmado: true
  fonte: inventado (região de prova)

feriados_nacionais:
  fixos:
    - { mes: 1, dia: 1, nome: Ano Novo }
    - { mes: 4, dia: 25, nome: Dia da Liberdade }
    - { mes: 5, dia: 1, nome: Dia do Trabalhador }
    - { mes: 6, dia: 10, nome: Dia de Portugal }
    - { mes: 8, dia: 15, nome: Assunção de Nossa Senhora }
    - { mes: 10, dia: 5, nome: Implantação da República }
    - { mes: 11, dia: 1, nome: Todos os Santos }
    - { mes: 12, dia: 1, nome: Restauração da Independência }
    - { mes: 12, dia: 8, nome: Imaculada Conceição }
    - { mes: 12, dia: 25, nome: Natal }
  moveis:
    - { deslocamento: -2, nome: Sexta-feira Santa }
    - { deslocamento: 0, nome: Domingo de Páscoa }
    - { deslocamento: 60, nome: Corpo de Deus }
  feriados_operadora: []

# Por preencher, os dois — de propósito. Ver o cabeçalho.
feriados_municipais:
  - { concelho: pedra-alta, data: null, confirmado: false, fonte: null }
  - { concelho: ribeira-do-corvo, data: null, confirmado: false, fonte: null }

codigos:
  periodo:
    A: { nome: Anual, regra: todo-o-ano }
    E: { nome: Escolar, regra: periodos-de-aulas }
    FE: { nome: Férias escolares, regra: periodos-de-ferias }
  dias:
    U: { nome: Dias úteis, dias_da_semana: [1, 2, 3, 4, 5], exclui_feriados: true }
    S: { nome: Sábados, dias_da_semana: [6], exclui_feriados: true }
    DF: { nome: Domingos e feriados, dias_da_semana: [7], inclui_feriados: true }
  digitos:
    regra: dias-da-semana-por-digito
    mapa: { "2": 1, "3": 2, "4": 3, "5": 4, "6": 5 }
    exclui_feriados: true
