  - id: calendario-escolar-despacho
    ambito: nacional  # o calendário escolar é fixado por despacho, para o país inteiro
    nome: Calendário escolar 2024/2025 a 2027/2028 (Despacho n.º 8368/2024, alterado pelo n.º 10430/2026)
    url: https://files.diariodarepublica.pt/2s/2024/07/143000000/0016600171.pdf
    url_alternativo: https://diariodarepublica.pt/dr/detalhe/despacho/8368-2024-873447631
    formato: pdf
    acesso: manual
    acesso_nota: >-
      A PÁGINA do despacho serve o texto por JavaScript e devolve a mesma casca
      de 2 346 bytes a qualquer cliente sem navegador — foi por isso que a
      primeira transcrição saiu de publicações que o reproduzem. **O PDF da
      2.ª série não**: está em `files.diariodarepublica.pt` como ficheiro
      estático e descarrega-se com um pedido. É de lá que vêm as datas que
      estão hoje no `calendario.yaml`, lidas do Anexo I e do Anexo II.

      Fica `acesso: manual` de propósito. Um despacho publicado não muda, e
      descarregá-lo em cada corrida do pipeline é pedir a um serviço público
      um ficheiro que já temos. Entra uma vez, com a data.
    ficheiro: data/manual/despacho-8368-2024.pdf
    sha256: "f4b7b76bd607a62cc46c9ff26b9cf80b283fe7ad9e09eaa05efe5158a1232a0c"
    ficheiro_nota: >-
      SEM eixo de região, ao contrário dos outros manuais: o calendário escolar
      é nacional. Qualquer região deste produto usa o mesmo despacho, e pô-lo
      em `data/manual/<regiao>/` fazia a próxima região transcrever outra vez a
      mesma lei.
    licenca: documento-publico
    atribuicao: Diário da República — Ministério da Educação
    verificado_em: 2026-09-20
    obtido_em: 2026-09-20
    notas: >-
      O calendário escolar NÃO é invenção da operadora: é fixado por despacho e
      publicado. O Despacho n.º 8368/2024, de 25 de julho, fixa quatro anos
      letivos de uma vez — 2024/2025 a 2027/2028 —, por isso 2026/2027 e
      2027/2028 já são lei. O Despacho n.º 10430/2026, de 21 de agosto, altera uma linha: o
      arranque dos cursos científico-humanísticos do secundário passa para 21
      de setembro de 2026.

      O QUE ESTA FONTE RESOLVE: as três interrupções, com data exata (Natal
      16–31/12/2026, Carnaval 8–10/02/2027, Páscoa 22/03–02/04/2027). É onde
      estava o risco grande, porque a Páscoa anda de ano para ano e o Carnaval
      com ela.

      O QUE NÃO RESOLVE, e continua a precisar do calendário de funcionamento
      que cada operadora publica: o arranque é um INTERVALO de cinco dias
      e cada agrupamento escolhe lá dentro; o fim do 3.º período tem três datas
      conforme o ciclo (4, 11 ou 30 de junho de 2027). Esses dias ficam
      `tipo: incerto` no calendario.yaml e fora dos serviços escolares.

