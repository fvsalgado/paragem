  # --- Tempo real (não construído; ver docs/TEMPO-REAL.md) -----------------

  - id: cp-tempo-real
    ambito: nacional
    nome: CP — quadro de estação e percurso de comboio, em tempo real
    url: https://api-gateway.cp.pt/cp/services/travel-api
    formato: json
    acesso: proibido-sem-autorizacao
    acesso_nota: >-
      NÃO É UMA API ABERTA, e a distinção importa mais do que parece. O
      gateway exige três cabeçalhos — `X-Api-Key`, `x-cp-connect-id` e
      `x-cp-connect-secret` — e só aceita pedidos com origem `cp.pt`. As
      chaves que circulam em projetos de terceiros são as que o site da CP
      carrega no navegador, no `fe-config.json` dele: são da CP, não de quem
      as copia, e o facto de estarem ao alcance de quem abre as ferramentas
      de programador não as torna públicas. O §4.2 diz «não usar APIs
      privadas»; esta é uma. Acresce que o repositório do produto vai ser
      público (§11.6) e que o destinatário é uma autoridade de transportes:
      um organismo público a apresentar-se como o sítio da CP é outra ordem
      de risco. Só entra com autorização escrita da CP — e aí com
      credenciais próprias, nunca com as do site.
    licenca: por-confirmar
    atribuicao: CP — Comboios de Portugal
    verificado_em: 2026-09-21
    obtido_em: null
    notas: >-
      O QUE TRARIA, e é exatamente o que falta ao GTFS: atraso em minutos,
      plataforma, supressão, ETA/ETD por paragem, `IN_TRANSIT` e a última
      estação por onde o comboio passou. Não há GPS — a posição é ao nível da
      estação. Não existe alternativa aberta: procurado no dados.gov.pt e no
      NAP a 21/09/2026, a CP publica o GTFS estático e nada de tempo real.
      O trabalho de identificadores JÁ ESTÁ FEITO: o código de estação do
      gateway é o do GTFS com hífen em vez de underscore — `94-32466` para
      `94_32466`, Riachos. Não é preciso mapa de correspondência nenhum.

  - id: nap-portugal
    ambito: nacional
    nome: Ponto de Acesso Nacional para dados de mobilidade (IMT)
    url: https://nap-portugal.imt-ip.pt/API/api
    formato: json
    acesso: api-em-direto
    acesso_nota: >-
      É A PORTA DA FRENTE, e foi feita exatamente para isto. O Regulamento
      Delegado (UE) 2017/1926 obriga cada Estado-Membro a ter um Ponto de
      Acesso Nacional onde os dados de viagem — estáticos e dinâmicos — se
      publicam e se pedem. Em Portugal é este, do IMT.

      SEM robots.txt NENHUM neste domínio (404), ao contrário do sítio da
      Infraestruturas de Portugal. As tabelas de referência respondem a quem
      as peça:

        GET /API/api/MultimodalSupplies/DatasetTypeCategories?local=pt
        GET /API/api/MultimodalSupplies/DatasetTypeCategoryDetailedTypes?local=pt

      A LISTA DOS FORNECIMENTOS DÁ 401: é preciso conta. E há um pedido de
      acesso formal na própria API (`AccessRequest/Submit`), que é o mecanismo
      que o regulamento desenhou — pede-se ao fornecedor, pelo Ponto de
      Acesso, em vez de se ir buscar por fora.

      O passo que falta é de PESSOA e não de código: registar conta como a
      autoridade de transportes ou como o produto. Feito isso, listam-se os
      fornecimentos ferroviários e pede-se acesso aos que interessam.
    licenca: por-confirmar
    licenca_nota: >-
      A licença é por fornecimento e declara-se lá dentro — o próprio modelo
      tem `ContractsOrLicences`. É outra razão para entrar por aqui: a
      pergunta «com que licença é que isto se pode reutilizar» tem campo
      próprio, em vez de ficar por confirmar para sempre.
    atribuicao: IMT — Instituto da Mobilidade e dos Transportes
    verificado_em: 2026-09-21
    obtido_em: null
    notas: >-
      Encontrado a 21/09/2026 ao procurar a via sancionada para o tempo real
      ferroviário, depois de o robots.txt da IP fechar a porta de trás. É a
      via que serve as três fontes de tempo real de uma vez, e não só o
      comboio.

  - id: ip-partidas-chegadas
    ambito: nacional
    nome: Infraestruturas de Portugal — partidas e chegadas em tempo real
    url: https://www.infraestruturasdeportugal.pt/negocios-e-servicos/horarios
    formato: json
    acesso: nao-usar
    acesso_nota: >-
      O ROBOTS.TXT DA IP PROÍBE ESTES DOIS ENDEREÇOS, POR NOME. Das 36 regras
      `Disallow` do ficheiro, 34 são as do Drupal de fábrica — `/admin/`,
      `/user/login`, os README. As duas últimas foram escritas de propósito, e
      são exatamente os horários:

        Disallow: /negocios-e-servicos/horarios-ncombio/*
        Disallow: /negocios-e-servicos/partidas-chegada/*

      O CLAUDE.md §4.3 não abre exceções: não se automatiza um sítio que o
      proíbe. Não é questão de autorização — a IP é entidade pública e o que
      publica é informação do setor público —, é que o operador do sítio
      escreveu que não quer acesso automático a isto.

      E HÁ UMA LETRA DE DIFERENÇA, que fica registada em vez de aproveitada: a
      regra diz `partidas-chegada` e o endereço a sério é
      `partidas-chegadas`, com S. Um leitor estrito de robots.txt diria que a
      regra não apanha o caminho. Seria ler uma gralha como licença: as duas
      únicas regras que alguém se deu ao trabalho de escrever naquele ficheiro
      são os horários, e o que elas dizem é claro.
    licenca: por-confirmar
    atribuicao: Infraestruturas de Portugal
    verificado_em: 2026-09-21
    obtido_em: null
    notas: >-
      OS ENDEREÇOS FICAM ESCRITOS, para ninguém repetir esta pesquisa:

        GET /negocios-e-servicos/estacao-nome/{nome}
            → [{Distancia, NodeID, Nome}] — este NÃO está no robots
        GET /negocios-e-servicos/partidas-chegadas/{NodeID}/{DD-MM-AAAA HH:MM}/{DD-MM-AAAA HH:MM}/{tipos}
        GET /negocios-e-servicos/horarios-ncombio/… (o separador «Número do Comboio»)

      Sem autenticação e no mesmo domínio do sítio público — ao contrário do
      gateway da CP, não há credenciais de ninguém pelo meio. O que há é uma
      proibição escrita.

      PORQUE É QUE VALIA A PENA: a IP é a GESTORA DA INFRAESTRUTURA, e vê
      todos os comboios da rede, seja qual for o operador. Uma fonte só
      cobriria o que hoje exigiria uma por operadora. É o pedido que vale mais
      a pena fazer — e a uma entidade pública o pedido invoca o regime de
      reutilização de informação do setor público, em vez de pedir um favor.

  - id: flixbus-pesquisa
    ambito: nacional
    nome: FlixBus — pesquisa de viagens, com preço e lugares
    url: https://global.api.flixbus.com/search/service/v4/search
    formato: json
    acesso: api-em-direto
    acesso_nota: >-
      SEM AUTENTICAÇÃO — é o mesmo endereço que o sítio da FlixBus usa, e
      responde a qualquer pedido. Não é documentado, o que quer dizer que
      pode mudar sem aviso e que nada nos é prometido. O robots.txt do
      `www.flixbus.pt` proíbe `/track/ride/`, `/track/station/`,
      `/track/order/` e `/flux/`, e não a pesquisa; o `global.api.flixbus.com`
      não serve robots.txt. Pelo §4.3 não há impedimento. Por confirmar são
      os termos de utilização quanto a REPUBLICAR preços e lugares — que é
      coisa diferente de os consultar.
    licenca: por-confirmar
    atribuicao: FlixBus
    verificado_em: 2026-09-21
    obtido_em: null
    notas: >-
      Devolve, por viagem: partida e chegada com fuso, o nome da paragem de
      cada ponta — «Lisboa (Oriente)» e «Lisboa (Sete Rios)» não são a mesma
      coisa para quem vai apanhar o autocarro —, duração, preço já com taxa
      de plataforma, lugares disponíveis e se é direto. As cidades são UUID
      da FlixBus e não os `stop_id` do GTFS: aqui, ao contrário da CP, é
      preciso uma correspondência.

