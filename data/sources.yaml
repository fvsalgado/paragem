# O registo de todas as fontes de dados.
#
# É o que o CLAUDE.md §4.1 exige: cada conjunto de dados com o endereço, a data
# de obtenção, a licença e a atribuição que impõe. Uma fonte que não esteja
# aqui não entra no pipeline — não por burocracia, mas porque um dado sem
# proveniência não se consegue defender no dia em que alguém pergunte de onde
# veio.
#
# Este ficheiro é o registo de PROVENIÊNCIA. O que cada região faz com cada
# fonte — que leitor a lê e com que parâmetros — está em
# `regioes/<id>/fontes.yaml`. Os dois juntam-se pelo `id` da fonte, e o
# `uv run pipeline check-proveniencia` verifica que nenhuma região usa uma
# fonte que não esteja aqui e que nada aqui contradiz o `REUSE.toml` ou o
# `docs/TERCEIROS.md`.
#
# `obtido_em` é a data em que o ficheiro foi realmente descarregado, escrita
# pelo pipeline. `verificado_em` é a data em que uma pessoa confirmou que o
# endereço e os termos continuam a ser estes.
#
# O `sha256` vai ENTRE ASPAS. Sem elas, uma soma composta só por dígitos é lida
# pelo YAML como um número — e uma que comece por zero perde o zero, ou, sendo
# toda zeros, passa a ser falsa e o guarda salta-a. Não é hipotético: foi assim
# que o teste do guarda o apanhou a não guardar nada.
#
# `sha256` declara-se nos ficheiros que NÃO devem mudar sozinhos — os que
# entram à mão e os de referência. Uma soma diferente nesses é um aviso no
# relatório: ou alguém substituiu o ficheiro, ou a origem republicou outra
# coisa com o mesmo nome, e nenhuma das duas deve acontecer em silêncio.
#
# Nos ficheiros de acesso automático NÃO se declara: a CP, a FlixBus e o
# OpenStreetMap republicam legitimamente todas as semanas, e uma soma fixa ali
# só faria o pipeline reprovar por o mundo ter andado. Esses são comparados com
# a última soma observada (`.cache/obtencoes.yaml`), e uma mudança fica contada
# sem ser tratada como defeito.

versao: 1

fontes:
  # --- Comboio -------------------------------------------------------------

  - id: cp-gtfs
    ambito: nacional  # o operador ferroviário nacional
    nome: GTFS da CP
    url: https://publico.cp.pt/gtfs/gtfs.zip
    formato: gtfs
    acesso: automatico
    licenca: por-confirmar
    licenca_nota: >-
      Publicado abertamente pela CP e sem declaração de licença encontrada. Por
      confirmar com a CP antes de republicar seja o que for.
    atribuicao: CP — Comboios de Portugal
    verificado_em: 2026-09-19
    obtido_em: null
    notas: >-
      Declara validade até 12/12/2026. Sem perturbações nem tempo real.

      A cobertura NUMA região não se declara aqui: é a construção dessa região
      que a mede, e a lacuna sai no relatório dela. Uma estação que falte é um
      facto sobre o território e não sobre a fonte.
    robots_nota: >-
      ATENÇÃO, E É UMA DECISÃO POR TOMAR. O `publico.cp.pt/robots.txt` é
      `User-agent: * / Disallow: /` — o host inteiro. O §4.3 diz para não
      automatizar sítios que o proíbem, e o `pipeline fetch` descarrega isto
      todas as semanas. O argumento a favor é que um robots.txt governa quem
      RASTEIA, e isto é um ficheiro que a CP publica para ser descarregado,
      pedido uma vez por semana e por um URL fixo — não há rastreio nenhum. O
      argumento contra é que a regra do §4.3 não abre exceções e quem a
      escreveu não previu este caso. Fica escrito para ser decidido por quem
      publica, e não resolvido em silêncio por quem programa. Verificado a
      21/09/2026.

  # --- Expresso ------------------------------------------------------------

  - id: flixbus-gtfs
