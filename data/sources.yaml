  # --- Segunda região de prova ---------------------------------------------
  #
  # Duas regiões inventadas, e não uma. Uma região sozinha não prova
  # multi-região: não há com que a comparar — nem caixas que se possam
  # sobrepor, nem identificadores de concelho que possam colidir, nem um
  # segundo artigo que impeça uma contração de ficar colada ao código.
  #
  # Enquanto a compilação de dados de um cliente vivia neste repositório, era
  # ela o segundo par — ou seja, a promessa comercial do produto estava a ser
  # verificada contra dados de alguém. Depois de as regiões passarem a poder
  # viver em raízes suas (docs/RAIZES.md), este repositório ficaria com uma
  # região só, e sem nada que provasse o multi-região.

  - id: prova-gtfs-savel
    nome: GTFS do Sável Bus (segunda região de prova)
    url: null
    formato: gtfs
    acesso: local
    ficheiro: data/manual/prova-municipio/gtfs-savel/
    licenca: AGPL-3.0-only
    atribuicao: null
    verificado_em: 2026-09-21
    obtido_em: null
    notas: >-
      Inventado de fio a pavio, como o da Serra. Uma linha, quatro paragens,
      duas viagens: o mínimo com que uma região existe. É deliberadamente mais
      pobre do que o outro — a autoridade de transportes é um MUNICÍPIO e não
      uma comunidade intermunicipal, e o produto tem de nascer inteiro com uma
      câmara sozinha (CLAUDE.md §11.3).
