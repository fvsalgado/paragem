    nome: GTFS genérico europeu da FlixBus
    url: https://gtfs.gis.flix.tech/gtfs_generic_eu.zip
    formato: gtfs
    acesso: automatico
    licenca: por-confirmar
    atribuicao: FlixBus
    verificado_em: 2026-09-19
    obtido_em: null
    notas: >-
      Cerca de 30 MB, com a Europa toda. Filtra-se às viagens que servem a
