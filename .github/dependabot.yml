version: 2

# As atualizações de versão vão para o `pre`, como tudo o resto: confere-se lá
# e só depois passam ao `main`. As de segurança, o GitHub abre-as sempre contra
# o ramo por omissão. O desenho é o do Coreto (fvsalgado/coreto).
updates:
  - package-ecosystem: npm
    directory: /web
    target-branch: pre
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Lisbon
    open-pull-requests-limit: 5
    versioning-strategy: increase-if-necessary
    commit-message:
      prefix: deps
      prefix-development: deps-dev
    # As versões grandes ficam para uma sessão própria (decisão do dono a
    # 1/11/2026): o Next 16 trouxe 15 erros de tipos, o TypeScript 7 mudou a
    # formatação, e o maplibre 6.16 parte um teste do mapa. Um PR do Dependabot
    # que nunca fica verde só ocupa um dos cinco lugares. Subir qualquer um
    # destes continua a ser uma decisão, feita à mão; as correcções pequenas
    # (patch) continuam a chegar.
    ignore:
      - dependency-name: next
        update-types: ["version-update:semver-major"]
      - dependency-name: react
        update-types: ["version-update:semver-major"]
      - dependency-name: react-dom
        update-types: ["version-update:semver-major"]
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: maplibre-gl
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      # O Next e o React sobem juntos ou não sobem: um sem o outro dá quase
      # sempre uma incompatibilidade de tipos.
      framework:
        patterns:
          - next
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
      # As ferramentas de desenvolvimento em bloco: uma revisão por semana chega.
      ferramentas:
        dependency-type: development
        exclude-patterns:
          - "@types/react"
          - "@types/react-dom"

  # O pipeline: as dependências que o `uv.lock` fixa.
  - package-ecosystem: uv
    directory: /
    target-branch: pre
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Lisbon
    open-pull-requests-limit: 3
    commit-message:
      prefix: deps
    groups:
      pipeline:
        patterns: ["*"]

  # A imagem do serviço de disponibilidade. A versão do Node está fixada de
  # propósito (`disponibilidade/Dockerfile`): o PR propõe, e subir continua a
  # ser uma decisão.
  - package-ecosystem: docker
    directory: /disponibilidade
    target-branch: pre
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Lisbon
    open-pull-requests-limit: 1
    commit-message:
      prefix: deps
    # O Node sobe de versão grande numa sessão própria (decisão do dono a
    # 1/11/2026), como as dependências grandes do sítio.
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    target-branch: pre
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Lisbon
    open-pull-requests-limit: 3
    commit-message:
      prefix: ci
    groups:
      acoes:
        patterns: ["*"]
