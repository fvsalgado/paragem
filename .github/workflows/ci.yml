name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# Uma execução por ramo: um push novo torna a anterior irrelevante antes de ela
# acabar, e deixá-la a correr só atrasa a que interessa.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # A versão do poppler está fixada de propósito. A saída de `pdftotext -layout`
  # muda entre versões, e é contra ela que os números do §6.1 são verificados —
  # uma atualização silenciosa mudava as contagens sem que nada no repositório
  # tivesse mudado. Ver docs/ARQUITETURA.md.
  POPPLER_ESPERADO: "24.02"

jobs:
  qualidade:
    name: Qualidade
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Instalar o uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true

      - run: uv sync --locked

      # O parser de horários corre contra o PDF verdadeiro, que está no
      # repositório — é por isso que os testes conseguem afirmar 122 linhas,
      # 230 blocos e 903 viagens sem descarregar nada.
      - name: Dependências de sistema
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          versao="$(pdftotext -v 2>&1 | head -1 | grep -oE '[0-9]+\.[0-9]+' | head -1)"
          echo "poppler $versao"
          if [ "$versao" != "$POPPLER_ESPERADO" ]; then
            echo "::warning::poppler $versao, esperado $POPPLER_ESPERADO —" \
                 "a saída de -layout muda entre versões; reconferir os números do §6.1."
          fi

      - name: Formatação
        run: uv run ruff format --check .

      - name: Análise estática
        run: uv run ruff check .

      # Apanha o que o ruff não vê: um nome reutilizado com outro tipo, um
      # `None` que escapa. Na primeira corrida apanhou um `s` que era uma linha
      # de `stops.txt` e passava a ser um inteiro dez linhas abaixo.
      - name: Tipos
        run: uv run mypy

      - name: Testes
        run: uv run pytest -q

      # Três ficheiros dizem de onde vêm os dados: data/sources.yaml,
      # REUSE.toml e docs/TERCEIROS.md. Três sítios divergem.
      - name: Proveniência
        run: uv run pipeline check-proveniencia

      # Os números do §6 são o critério de aceitação da Fase 1. Escritos à mão,
      # envelhecem a mentir — por isso são conferidos contra os ficheiros.
      - name: Números
        run: uv run pipeline check-numeros

  # A base de dados, provada num Postgres limpo em cada corrida.
  #
  # As migrações em `supabase/migrations/` são o que faz nascer a base do
  # painel (docs/BASE-DE-DADOS.md). Aplicam-se aqui, por ordem, a um Postgres
  # da mesma versão maior que o Supabase gerido serve, e a seguir correm as
  # asserções e a comparação com os `regiao.yaml`. É o que impede que uma
  # migração partida — ou um seed que escreva o nome de uma região de outra
  # maneira que o `regiao.yaml` dela — chegue ao projeto real. O desenho é o
  # do Coreto (fvsalgado/coreto), levantado.
  migracoes:
    name: Migrações
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        # A mesma versão maior do projeto gerido: a paridade com produção
        # conta mais do que a novidade.
        image: postgres:17
        env:
          # Sem palavra-passe, de propósito. A base existe durante o job, só
          # aceita ligações da própria máquina e desaparece no fim; escrever
          # aqui uma palavra-passe seria pôr num ficheiro versionado um
          # literal com ar de segredo.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true

      - run: uv sync --locked

      # O `psql` já vem na imagem do runner. A guarda mantém o trabalho a
      # funcionar no dia em que deixar de vir — e a dizê-lo alto.
      - name: Garantir o cliente do PostgreSQL
        run: |
          if command -v psql >/dev/null 2>&1; then
            psql --version
          else
            echo "::warning::O runner deixou de trazer o psql; a instalar."
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends postgresql-client
          fi

      - name: Aplicar e verificar as migrações
        env:
          DATABASE_URL: postgres://postgres@localhost:5432/postgres
        run: ./scripts/verify-migrations.sh

      # A base e os regiao.yaml têm de dizer o mesmo — nome e artigo de cada
      # região, e nenhum módulo desligado que a região nem declare.
      - name: A base diz o mesmo que os regiao.yaml
        env:
          DATABASE_URL: postgres://postgres@localhost:5432/postgres
        run: uv run python ferramentas/verificar-seeds.py

  regioes:
    name: Regiões
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true

      - run: uv sync --locked

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Dependências de sistema
        run: sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool

      # AS REGIÕES DESTA RAIZ SÃO INVENTADAS: constroem-se sem rede e sem
      # pedir uma linha a ninguém. As duas de prova provam que uma autoridade
      # de transportes nova entra sem um commit de código, e que o produto é
      # multi-região — uma sozinha não tem com que se comparar. A de
      # demonstração, com os sete modos e o mapa desenhado por nós, prova o
      # mesmo contrato no caso mais exigente.
      #
      # Constroem-se TODAS, e nenhuma pelo nome: uma região nova entra no CI
      # sem tocar neste ficheiro. É de propósito que nenhuma é um cliente — o
      # CI do produto corre inteiro onde não há dados de ninguém
      # (docs/RAIZES.md). A demonstração acrescenta uns dez segundos, quase
      # todos do validador de GTFS.
      - name: Construir as regiões desta raiz
        run: uv run pipeline build --todas --sem-rede

      # Zero fugas: nada de uma região dentro das saídas das outras — agora
      # com as saídas construídas aqui mesmo, e com o calendário de cada feed
      # próprio a ter pelo menos dois meses pela frente.
      - name: Verificar as regiões
        run: uv run pipeline check-regioes

      - name: Guardar o relatório
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: relatorio-prova
          path: build/reports/
          if-no-files-found: ignore

  # SEGREDOS E DEPENDÊNCIAS, como no Coreto: o repositório é público, e um
  # segredo que entra num commit fica no histórico de quem o clonou.
  seguranca:
    name: Segredos e dependências
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # O gitleaks pede à API a lista de commits do PR. Num repositório público
    # chega o `contents: read`; num privado — um fork, ou no dia em que este o
    # for — a API responde 403 sem `pull-requests: read`. Foi assim que falhou
    # no Em Cada Esquina, e no Coreto antes dele.
    permissions:
      contents: read
      pull-requests: read
    steps:
      # O histórico inteiro: o gitleaks varre os commits do PR, e precisa deles.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      # Gitleaks e não ggshield: nada aqui recebe segredos, para o CI passar
      # num fork. Os falsos positivos vistos um a um estão no `.gitleaksignore`.
      # Sem `GITLEAKS_LICENSE`, que só é exigida a organizações.
      - name: Varrimento de segredos
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # O passo a falhar já é o sinal; comentar no PR pedia escrita.
          GITLEAKS_ENABLE_COMMENTS: "false"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      # SÓ PRODUÇÃO, E SÓ ALTO E CRÍTICO, pela razão do Coreto: uma ferramenta
      # de construção com um aviso não serve nada a quem visita, e um alarme
      # que toca por tudo é o que se aprende a ignorar. Lê o `package-lock.json`
      # e mais nada — não instala.
      #
      # O PostCSS que o Next 15 traz (8.4.31) tem avisos altos que o npm só
      # corrige com o Next 16. O `overrides` do `web/package.json` força a 8.5,
      # compatível dentro da 8.x; sai quando o Next subir de versão maior.
      - name: Vulnerabilidades conhecidas no sítio
        working-directory: web
        run: npm audit --omit=dev --audit-level=high

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      # As dependências do pipeline, tal como o `uv.lock` as fixa, sem as de
      # desenvolvimento. O `pip-audit` lê a lista com os hashes e não instala.
      - name: Vulnerabilidades conhecidas no pipeline
        run: |
          uv export --frozen --no-dev --no-emit-project --format requirements-txt > "$RUNNER_TEMP/requisitos.txt"
          uvx pip-audit@2.10.1 -r "$RUNNER_TEMP/requisitos.txt" --disable-pip --require-hashes --progress-spinner off
