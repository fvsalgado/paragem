# O proxy à frente do motor de viagens.
#
# O CLAUDE.md §7 diz: «Expor só a API GraphQL necessária, atrás de um proxy com
# limites.» Isto é esse proxy, e as duas metades da frase são requisitos
# separados:
#
# 1. **Só a API necessária.** O OTP serve muito mais do que o planeamento de
#    viagens — uma interface de depuração, mosaicos vetoriais, a API
#    Transmodel, ficheiros do grafo. Nada disso é preciso para o sítio, e tudo
#    isso é superfície de ataque e largura de banda.
#
# 2. **Com limites.** Cada pedido ao OTP é um cálculo de caminhos sobre um
#    grafo de 97 MB. Não é servir um ficheiro: é trabalho de CPU medido em
#    centenas de milissegundos. Um OTP aberto sem limites derruba-se com um
#    portátil.
#
# **Porque é que o proxy vive aqui e não numa função da plataforma do sítio.**
# O sítio é ficheiros estáticos, e é assim de propósito: uma câmara que
# licencie o produto tem de o poder alojar onde quiser. Pôr o proxy numa função
# amarrava o produto a uma plataforma com funções. Aqui, o proxy viaja com a
# coisa que protege — quem levanta o motor levanta o proxy, e não há como
# levantar um sem o outro.

# O PEDIDO PRÉVIO NÃO CONTA PARA O LIMITE, e a razão não é de conveniência.
#
# Um `OPTIONS` é respondido aqui mesmo, com 204, sem tocar no motor: não custa
# nada. Mas o navegador manda-o ANTES do pedido a sério, e se levar 429 nem
# chega a tentar o POST — quem passou da conta ficava sem planeador até o
# navegador esquecer o resultado do pedido prévio, que pode ser um dia inteiro.
# É punir o utilizador legítimo mais do que quem abusa.
#
# O nginx não aplica o limite quando a chave é vazia, e é assim que se isenta.
map $request_method $chave_do_limite {
    OPTIONS "";
    default $binary_remote_addr;
}

# Os métodos que se aceitam. Decide-se aqui, num `map`, e não com um
# `limit_except` na location — o `limit_except` corre na fase de acesso e
# apanhava o `OPTIONS` antes de ele chegar à resposta do pedido prévio, que
# passava a 403. O navegador, com 403 no prévio, nem tentava o POST.
map $request_method $metodo_aceite {
    POST    1;
    OPTIONS 1;
    default 0;
}

# `$binary_remote_addr` e não `$remote_addr`: ocupa 4 bytes em vez de até 15, e
# numa zona de 10 MB cabem ~160 mil endereços em vez de ~40 mil.
limit_req_zone $chave_do_limite zone=viagens:10m rate=6r/s;
limit_conn_zone $binary_remote_addr zone=ligacoes:10m;

# O OTP não está publicado: só este proxy lhe chega, pela rede interna do
# compose. O nome é o do serviço.
upstream motor {
    server motor:8080;
    keepalive 16;
}

server {
    listen 8080;
    server_name _;

    # Nada de anunciar a versão do nginx a quem pergunta.
    server_tokens off;

    # Um pedido GraphQL do planeador tem uns 900 bytes. 16 kB é folga
    # generosa; um megabyte de consulta é um ataque, não um pedido.
    client_max_body_size 16k;
    client_body_timeout 10s;
    client_header_timeout 10s;

    limit_conn ligacoes 8;

    # Quando o limite bate, 429 e não 503: «estás a pedir depressa demais» é
    # informação diferente de «o serviço está em baixo», e quem escreve o
    # cliente precisa de as distinguir.
    limit_req_status 429;
    limit_conn_status 429;

    # O sítio é estático e vive noutro domínio, por isso o navegador faz
    # pedido prévio. A origem permitida vem do ambiente — nada de `*`: um
    # `*` deixa qualquer página do mundo gastar o nosso CPU.
    set $origem_permitida "${PARAGEM_ORIGEM}";

    # --- a única coisa que se expõe ---------------------------------------
    #
    # A API GraphQL do GTFS, e mais nada. Tudo o resto responde 404 — não 403,
    # que confirmaria que existe.
    location = /otp/gtfs/v1 {
        limit_req zone=viagens burst=12 nodelay;

        # 405 e não 403: um GET aqui não é uma tentativa de entrar onde não se
        # pode — é o método errado num sítio que existe e que o próprio sítio
        # usa. Dizer a verdade custa menos do que esconder o que já se sabe.
        #
        # `if` com `return` é um dos dois usos que a documentação do nginx dá
        # como seguros dentro de uma location. Os outros é que são de evitar.
        if ($metodo_aceite = 0) {
            return 405;
        }
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $origem_permitida always;
            add_header Access-Control-Allow-Methods "POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type" always;
            add_header Access-Control-Max-Age 86400 always;
            add_header Content-Length 0;
            return 204;
        }

        add_header Access-Control-Allow-Origin $origem_permitida always;

        proxy_pass http://motor;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Um cálculo de caminhos demora menos de um segundo nesta região. Vinte
        # é folga para um dia mau; mais do que isso é uma consulta patológica a
        # segurar um processo, e é melhor cortá-la.
        proxy_connect_timeout 5s;
        proxy_send_timeout 20s;
        proxy_read_timeout 20s;
    }

    # --- a saúde, para quem aloja ------------------------------------------
    #
    # Sem limite de ritmo: é o que o orquestrador consulta, e limitá-lo dava
    # reinícios em cascata precisamente quando há carga.
    location = /saude {
        access_log off;
        proxy_pass http://motor/otp;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }

    # --- tudo o resto -------------------------------------------------------
    #
    # A interface de depuração do OTP, os mosaicos vetoriais, a API Transmodel,
    # o ficheiro do grafo. Nada disto é preciso ao sítio.
    location / {
        return 404;
    }
}
